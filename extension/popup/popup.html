<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 280px; font-family: system-ui, sans-serif; font-size: 13px; padding: 12px; background: #f5f5f5; }
    h2 { font-size: 16px; margin-bottom: 8px; color: #1a73e8; }
    .btn { width: 100%; padding: 8px 10px; margin-bottom: 6px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; text-align: center; }
    .btn-success { background: #0d904f; color: #fff; }
    .btn-danger { background: #d93025; color: #fff; }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <h2>超星助手</h2>

  <div style="display:flex;gap:6px;margin-bottom:6px;">
    <button class="btn btn-success" id="btn-auto" style="flex:1;">启动自动完成</button>
    <select id="speed-select" style="width:64px;padding:6px 4px;border:1px solid #ccc;border-radius:4px;font-size:12px;background:#fff;">
      <option value="1" selected>默认</option>
      <option value="auto">倍速</option>
    </select>
  </div>

  <button class="btn btn-danger" id="btn-runner-stop">停止</button>

  <script src="popup-scripts.js"></script>
  <script src="popup.js"></script>
</body>
</html>

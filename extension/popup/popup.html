<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 340px; font-family: system-ui, sans-serif; font-size: 13px; padding: 12px; background: #f5f5f5; }
    h2 { font-size: 16px; margin-bottom: 4px; color: #1a73e8; }
    .subtitle { font-size: 11px; color: #888; margin-bottom: 10px; }
    .btn { display: block; width: 100%; padding: 8px 10px; margin-bottom: 6px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: left; }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-success { background: #0d904f; color: #fff; }
    .btn-danger { background: #d93025; color: #fff; }
    .btn-secondary { background: #e8f0fe; color: #1a73e8; }
    .btn:hover { opacity: 0.85; }
    .btn-row { display: flex; gap: 6px; }
    .btn-row .btn { flex: 1; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <h2>超星助手</h2>
  <div class="subtitle">页面左上角显示进度 · 弹窗可关闭</div>

  <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
    <button class="btn btn-success" id="btn-auto" style="flex:1;margin-bottom:0;">🚀 启动自动完成</button>
    <select id="speed-select" style="padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:12px;background:#fff;">
      <option value="1" selected>默认</option>
      <option value="auto">倍速</option>
    </select>
  </div>

  <div class="btn-row">
    <button class="btn btn-secondary" id="btn-runner-status">📊 查看进度</button>
    <button class="btn btn-danger" id="btn-runner-stop">⏹ 停止</button>
  </div>

  <button class="btn btn-primary" id="btn-discover">🔍 探测任务点</button>
  <button class="btn btn-secondary" id="btn-chapters">📖 章节列表</button>

  <div class="btn-row">
    <button class="btn btn-secondary" id="btn-download">📥 下载附件</button>
    <button class="btn btn-secondary" id="btn-watch">👀 视频状态</button>
  </div>

  <script src="popup-scripts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
